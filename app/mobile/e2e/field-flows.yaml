appId: org.pulsefy.soter.mobile
name: Core field flows
onFlowStart:
  - clearState
  - launchApp
  - takeScreenshot: 00-start

onFlowFailure:
  - takeScreenshot: failure

---
# On a fresh install the update check falls back to a newer mock version,
# so the release-notes modal can cover the home screen at launch. Dismiss it
# when present, then open the scanner from the home screen FAB.
# tapOn waits up to `timeout` for the button; `optional` skips it if the
# modal never renders (e.g. update check matches the installed version).
- tapOn:
    text: "Got it!"
    optional: true
    timeout: 5000
- waitForAnimationToEnd
# The FAB exposes a stable testID (maps to the Android resource-id); its
# label text is merged into the button's accessibility node, so match by id.
- tapOn:
    id: "scan-qr-fab"
    retryTapIfNoChange: true
- assertVisible: "Scan QR Code"
- assertVisible: "Align QR code within the frame"
- tapOn:
    id: "scan-fixture"
    optional: true
- takeScreenshot: 01-scan

---
# Evidence capture flow. The test device grants camera/photo permissions.
- tapOn:
    text: "Upload Evidence"
- assertVisible: "Upload Evidence"
- tapOn:
    text: "Take Photo"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible: "Step 2: Preview"
- takeScreenshot: 02-evidence-preview

# Airplane mode queues the upload locally instead of sending it.
- tapOn: "Upload Evidence"
- toggleAirplaneMode
- assertVisible: "Offline mode: evidence upload will queue and resend when the device reconnects."
- tapOn: "Upload Evidence"
- assertVisible: "Upload queued and will send when connectivity returns."
- takeScreenshot: 03-offline-queued

# The reconnect transition flushes the durable queue.
- toggleAirplaneMode
- waitForAnimationToEnd
- tapOn: "Submission Queue"
- assertVisible: "Submission Queue"
- assertVisible: "Online"
- waitForAnimationToEnd
- assertNotVisible: "1 pending"
- takeScreenshot: 04-reconnected-synced
