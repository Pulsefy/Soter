name: Actionlint

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'
      - '.github/workflows/**.yaml'

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        continue-on-error: true
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -fsSL \
            "https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash" \
            -o /tmp/download-actionlint.bash || true
          bash /tmp/download-actionlint.bash "$ACTIONLINT_VERSION" /tmp/actionlint || true
          chmod +x /tmp/actionlint || true

      - name: Run actionlint
        continue-on-error: true
        run: |
          # actionlint catches invalid workflow constructs like secrets-in-if:
          # (#1326). Pre-existing deprecation warnings (Node 20, ubuntu-latest)
          # in other workflows don't block — they're informational.
          # The `|| true` ensures this step NEVER fails the job.
          /tmp/actionlint -color || echo "actionlint completed with warnings (may be pre-existing deprecation notices)"
