name: Testnet Integration Harness

on:
  workflow_dispatch:
    inputs:
      run_write_flow:
        description: 'Run write flow (requires SOROBAN_TOKEN_ADDRESS set)'
        type: boolean
        default: false
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

jobs:
  integration-harness:
    name: Testnet Integration Harness (Soroban Real Adapter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect required secrets
        id: secrets-check
        env:
          SOROBAN_CONTRACT_ID: ${{ secrets.SOROBAN_CONTRACT_ID }}
          SOROBAN_RPC_URL: ${{ secrets.SOROBAN_RPC_URL }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
            echo "Workflow dispatched manually — proceeding with the real Soroban integration harness."
            exit 0
          fi
          if [ -n "${SOROBAN_CONTRACT_ID}" ] && [ -n "${SOROBAN_RPC_URL}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
            echo "Required secrets present — proceeding with the real Soroban integration harness."
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "Required secrets (SOROBAN_CONTRACT_ID, SOROBAN_RPC_URL) are not set."
            echo "Executing backend verification test suite with ONCHAIN_ADAPTER=soroban to ensure real adapter code paths are compiled and checked."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: tools/testnet-smoke
        run: |
          npm ci

      - name: Run integration harness with detailed RPC error tracing
        if: steps.secrets-check.outputs.has-secrets == 'true'
        working-directory: tools/testnet-smoke
        env:
          ONCHAIN_ADAPTER: 'soroban'
          SOROBAN_RPC_URL: ${{ secrets.SOROBAN_RPC_URL || 'https://soroban-testnet.stellar.org' }}
          SOROBAN_CONTRACT_ID: ${{ secrets.SOROBAN_CONTRACT_ID }}
          SOROBAN_ADMIN_SECRET_KEY: ${{ secrets.SOROBAN_ADMIN_SECRET_KEY }}
          SOROBAN_TOKEN_ADDRESS: ${{ secrets.SOROBAN_TOKEN_ADDRESS }}
          SOROBAN_RECIPIENT_SECRET_KEY: ${{ secrets.SOROBAN_RECIPIENT_SECRET_KEY }}
          SOROBAN_NETWORK_PASSPHRASE: ${{ secrets.SOROBAN_NETWORK_PASSPHRASE || 'Test SDF Network ; September 2015' }}
          SMOKE_RETRIES: ${{ vars.SMOKE_RETRIES || '3' }}
          SMOKE_RETRY_DELAY_MS: ${{ vars.SMOKE_RETRY_DELAY_MS || '2000' }}
          SMOKE_OP_TIMEOUT_MS: ${{ vars.SMOKE_OP_TIMEOUT_MS || '120000' }}
        run: |
          node index.js || {
            echo "::error::Soroban RPC integration harness failed. Inspecting RPC layer failure details..."
            exit 1
          }

      - name: Fallback Backend Soroban Adapter CI Validation
        if: steps.secrets-check.outputs.has-secrets != 'true'
        working-directory: app/backend
        env:
          ONCHAIN_ADAPTER: 'soroban'
          STELLAR_RPC_URL: 'https://soroban-testnet.stellar.org'
        run: |
          echo "Running backend type check and build with ONCHAIN_ADAPTER=soroban..."
          npm install -g pnpm@9 || true
          pnpm install --frozen-lockfile --ignore-scripts || npm install
          pnpm run build