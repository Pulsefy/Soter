name: Testnet Integration Harness

on:
  workflow_dispatch:
    inputs:
      run_write_flow:
        description: 'Run write flow (requires SOROBAN_TOKEN_ADDRESS set)'
        type: boolean
        default: false
  push:
    branches:
      - main
      - 'release/**'

jobs:
  integration-harness:
    name: Testnet Integration Harness
    runs-on: ubuntu-latest
    # NOTE: GitHub Actions does not allow referencing the `secrets` context
    # directly inside a job-level `if:` conditional. The previous version had:
    #
    #   if: >
    #     github.event_name == 'workflow_dispatch' ||
    #     (secrets.SOROBAN_CONTRACT_ID != '' && secrets.SOROBAN_RPC_URL != '')
    #
    # That made the workflow fail to validate on every trigger, strictly worse
    # than the original flaky behaviour (#1173). Replaced by a first step that
    # reads the secrets via `env:` and exposes a step output (`has-secrets`),
    # which the subsequent steps gate on.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect required secrets
        id: secrets-check
        env:
          SOROBAN_CONTRACT_ID: ${{ secrets.SOROBAN_CONTRACT_ID }}
          SOROBAN_RPC_URL: ${{ secrets.SOROBAN_RPC_URL }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
            echo "Workflow dispatched manually — proceeding with the integration harness."
            exit 0
          fi
          if [ -n "${SOROBAN_CONTRACT_ID}" ] && [ -n "${SOROBAN_RPC_URL}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
            echo "Required secrets present — proceeding with the integration harness."
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "Required secrets (SOROBAN_CONTRACT_ID, SOROBAN_RPC_URL) are not set."
            echo "Skipping the integration harness on this run."
          fi

      - name: Setup Node
        if: steps.secrets-check.outputs.has-secrets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.secrets-check.outputs.has-secrets == 'true'
        working-directory: tools/testnet-smoke
        run: |
          npm ci

      - name: Run integration harness
        if: steps.secrets-check.outputs.has-secrets == 'true'
        working-directory: tools/testnet-smoke
        env:
          SOROBAN_RPC_URL: ${{ secrets.SOROBAN_RPC_URL || 'https://soroban-testnet.stellar.org' }}
          SOROBAN_CONTRACT_ID: ${{ secrets.SOROBAN_CONTRACT_ID }}
          SOROBAN_ADMIN_SECRET_KEY: ${{ secrets.SOROBAN_ADMIN_SECRET_KEY }}
          SOROBAN_TOKEN_ADDRESS: ${{ secrets.SOROBAN_TOKEN_ADDRESS }}
          SOROBAN_RECIPIENT_SECRET_KEY: ${{ secrets.SOROBAN_RECIPIENT_SECRET_KEY }}
          SOROBAN_NETWORK_PASSPHRASE: ${{ secrets.SOROBAN_NETWORK_PASSPHRASE || 'Test SDF Network ; September 2015' }}
          SMOKE_RETRIES: ${{ vars.SMOKE_RETRIES || '3' }}
          SMOKE_RETRY_DELAY_MS: ${{ vars.SMOKE_RETRY_DELAY_MS || '2000' }}
          SMOKE_OP_TIMEOUT_MS: ${{ vars.SMOKE_OP_TIMEOUT_MS || '120000' }}
        run: |
          node index.js
