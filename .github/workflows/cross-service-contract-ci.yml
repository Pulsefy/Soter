name: Cross-Service Contract CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/ai-service/**'
      - 'app/backend/**'
      - 'tests/fixtures/contract/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/ai-service/**'
      - 'app/backend/**'
      - 'tests/fixtures/contract/**'

jobs:
  contract-tests:
    name: Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        working-directory: app/ai-service
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pydantic

      - name: Run Python Contract Tests
        working-directory: app/ai-service
        run: pytest tests/test_backend_contract.py -v

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile --engine-strict=false

      - name: Run Backend Contract Tests
        working-directory: app/backend
        run: npx jest test/contract.spec.ts
