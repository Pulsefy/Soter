name: CI - Python Tests

on:
  push:
    paths:
      - 'app/ai-service/**'
  pull_request:
    paths:
      - 'app/ai-service/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core test dependencies
        working-directory: app/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov Pillow numpy httpx

      - name: Install remaining dependencies (optional)
        working-directory: app/ai-service
        continue-on-error: true
        run: |
          pip install -r requirements.txt

      - name: Run tests
        working-directory: app/ai-service
        run: |
          python -m pytest -q
