name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soter
          POSTGRES_PASSWORD: soter
          POSTGRES_DB: soter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soter -d soter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test
        run: |
          for i in {1..30}; do
            if pg_isready -d "$DATABASE_URL"; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Run Prisma migrations
        working-directory: app/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Check for Prisma schema/migration drift
        working-directory: app/backend
        run: |
          set -euo pipefail
          # Ensure a dedicated, empty shadow database exists so `prisma migrate diff
          # --from-migrations` has a scratch DB to materialize the migration history.
          # This is idempotent — it only issues CREATE DATABASE when it is missing.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL' >/dev/null
            SELECT 'CREATE DATABASE soter_shadow'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'soter_shadow')\gexec
          SQL

          # Fail the build whenever the migrations history and the Prisma schema
          # have diverged (exit code 2). schema/prisma.schema is the source of
          # truth; contributors must add a migration, not edit deployed databases.
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test
          SHADOW_DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_shadow

      - name: Lint
        run: pnpm --filter backend run lint

      - name: Test
        run: pnpm --filter backend run test
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Build
        run: pnpm --filter backend run build

  openapi-spec:
    name: OpenAPI spec — drift check & lint
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soter
          POSTGRES_PASSWORD: soter
          POSTGRES_DB: soter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soter -d soter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        working-directory: app/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Generate OpenAPI spec (fresh snapshot for review)
        working-directory: app/backend
        run: SPEC_OUTPUT_PATH=openapi/openapi.generated.json pnpm run spec:generate
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test
          # Minimal stubs so NestJS can bootstrap without real services
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test

      - name: Upload generated OpenAPI spec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-generated
          path: app/backend/openapi/openapi.generated.json
          if-no-files-found: warn

      - name: Check OpenAPI spec drift
        working-directory: app/backend
        run: pnpm run spec:check
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test
          # Minimal stubs so NestJS can bootstrap without real services
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test

      - name: Lint OpenAPI spec
        working-directory: app/backend
        run: pnpm run spec:lint

  contract-bindings:
    name: Contract bindings — drift check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --filter backend --frozen-lockfile --ignore-scripts

      # Guards that src/onchain/generated/aid-escrow.contract.ts still matches
      # the committed contract interface spec. The contract-vs-WASM half of the
      # check lives in Contract CI, which builds the Rust artifact.
      - name: Check contract bindings drift
        working-directory: app/backend
        run: pnpm run contract:check

