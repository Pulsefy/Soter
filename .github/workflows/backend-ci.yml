name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soter
          POSTGRES_PASSWORD: soter
          POSTGRES_DB: soter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        working-directory: app/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Lint
        run: pnpm --filter backend run lint

      - name: Test
        run: pnpm --filter backend run test
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Build
        run: pnpm --filter backend run build

  openapi-spec:
    name: OpenAPI spec — drift check & lint
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soter
          POSTGRES_PASSWORD: soter
          POSTGRES_DB: soter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        working-directory: app/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Check OpenAPI spec drift
        working-directory: app/backend
        run: pnpm run spec:check
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test
          # Minimal stubs so NestJS can bootstrap without real services
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test

      - name: Lint OpenAPI spec
        working-directory: app/backend
        run: pnpm run spec:lint
