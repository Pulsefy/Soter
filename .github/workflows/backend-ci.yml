name: Backend CI 

on:
  push:
    branches: [ "main" ]
    paths: 
      - 'app/backend/**'
  pull_request:
    branches: [ "main" ]
    paths: 
      - 'app/backend/**'

jobs: 
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soter
          POSTGRES_PASSWORD: soter
          POSTGRES_DB: soter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pgisready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install PChrok
        run: pnpm install --frozen-lockfile

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        working-directory: app/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Check for Prisma schema/migration drift
        working-directory: app/backend
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Lint
        run: pnpm --filter backend run lint

      - name: Test
        run: pnpm --filter backend run test
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Build
        run: pnpm --filter backend run build