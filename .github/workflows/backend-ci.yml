name: Backend CI

on:
  push:
    branches: ['main']
    paths:
      - 'app/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'app/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: ./app/backend
        run: pnpm install --no-frozen-lockfile --engine-strict=false

      - name: Lint
        working-directory: ./app/backend
        run: pnpm run lint

      - name: Test
        working-directory: ./app/backend
        run: pnpm run test

      - name: Build
        working-directory: ./app/backend
        run: pnpm run build
