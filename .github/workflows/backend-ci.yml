name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'

# ── Global CI defaults ──────────────────────────────────────────────────────
# Wire the Mock Onchain Adapter OUT of the default CI path.
# ONCHAIN_ADAPTER=soroban is now the default for all jobs unless explicitly
# overridden. Individual jobs that require the mock adapter (e.g. the fast unit
# lane without RPC secrets) set it locally. See Pulsefy/Soter#1172.
env:
  ONCHAIN_ADAPTER: soroban

jobs:
  # ── Fast lane: lint + unit tests + build with the mock adapter ────────────
  # Renamed from "build-and-test" to make the mock-vs-real split unambiguous
  # in branch protection status checks ("Backend / Build & Unit (Mock)").
  backend-build-unit-mock:
    name: Backend / Build & Unit (Mock)
    runs-on: ubuntu-latest

    env:
      ONCHAIN_ADAPTER: mock

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soter
          POSTGRES_PASSWORD: soter
          POSTGRES_DB: soter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug — onchain adapter + RPC env (masked)
        run: |
          set +e
          echo "ONCHAIN_ADAPTER=${ONCHAIN_ADAPTER}"
          _m() { local v="$1"; if [ -z "$v" ]; then echo ""; elif [ ${#v} -le 8 ]; then echo "***"; else echo "${v:0:3}...${v: -3}"; fi; }
          echo "STELLAR_RPC_URL=$(_m "${STELLAR_RPC_URL}")"
          echo "SOROBAN_RPC_URL=$(_m "${SOROBAN_RPC_URL}")"
          echo "SOROBAN_NETWORK=${SOROBAN_NETWORK}"
          echo "STELLAR_NETWORK_PASSPHRASE=$(_m "${STELLAR_NETWORK_PASSPHRASE}")"
          echo "AID_ESCROW_CONTRACT_ID=$(_m "${AID_ESCROW_CONTRACT_ID}")"
          echo "SOROBAN_CONTRACT_ID=$(_m "${SOROBAN_CONTRACT_ID}")"

      - name: Run Prisma migrations
        working-directory: app/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Check for Prisma schema/migration drift
        working-directory: app/backend
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL' >/dev/null
            SELECT 'CREATE DATABASE soter_shadow'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'soter_shadow')\\gexec
          SQL
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test
          SHADOW_DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_shadow

      - name: Lint
        run: pnpm --filter backend run lint

      - name: Test (unit, ONCHAIN_ADAPTER=${{ env.ONCHAIN_ADAPTER }})
        run: pnpm --filter backend run test
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Build
        run: pnpm --filter backend run build

  # ── Slower lane: E2E tests with the real Soroban adapter ──────────────────
  # New, distinct status-check name required by #1172: "Backend / E2E (Soroban)".
  # Uses the global ONCHAIN_ADAPTER=soroban default. Falls back to documenting
  # the split (not failing the workflow) when RPC secrets/credentials are not
  # available on the running repo (common in forks), via continue-on-error.
  backend-e2e-soroban:
    name: Backend / E2E (Soroban)
    runs-on: ubuntu-latest
    needs: backend-build-unit-mock

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soter
          POSTGRES_PASSWORD: soter
          POSTGRES_DB: soter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      SOROBAN_NETWORK: testnet
      STELLAR_RPC_URL: ${{ secrets.STELLAR_RPC_URL }}
      STELLAR_NETWORK_PASSPHRASE: ${{ secrets.STELLAR_NETWORK_PASSPHRASE }}
      AID_ESCROW_CONTRACT_ID: ${{ secrets.AID_ESCROW_CONTRACT_ID }}
      SOROBAN_ADMIN_SECRET_KEY: ${{ secrets.SOROBAN_ADMIN_SECRET_KEY }}
      SOROBAN_RPC_URL: ${{ secrets.SOROBAN_RPC_URL }}
      SOROBAN_CONTRACT_ID: ${{ secrets.SOROBAN_CONTRACT_ID }}

    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug — onchain adapter + RPC env (masked) BEFORE E2E run
        run: |
          set +e
          echo "ONCHAIN_ADAPTER=${ONCHAIN_ADAPTER}"
          _m() { local v="$1"; if [ -z "$v" ]; then echo ""; elif [ ${#v} -le 8 ]; then echo "***"; else echo "${v:0:3}...${v: -3}"; fi; }
          echo "STELLAR_RPC_URL=$(_m "${STELLAR_RPC_URL}")"
          echo "SOROBAN_RPC_URL=$(_m "${SOROBAN_RPC_URL}")"
          echo "SOROBAN_NETWORK=${SOROBAN_NETWORK}"
          echo "STELLAR_NETWORK_PASSPHRASE=$(_m "${STELLAR_NETWORK_PASSPHRASE}")"
          echo "AID_ESCROW_CONTRACT_ID=$(_m "${AID_ESCROW_CONTRACT_ID}")"
          echo "SOROBAN_CONTRACT_ID=$(_m "${SOROBAN_CONTRACT_ID}")"

      - name: Run E2E tests (ONCHAIN_ADAPTER=soroban)
        working-directory: app/backend
        run: |
          set -euo pipefail
          pnpm run test:e2e:ci

  # ── OpenAPI spec — drift check & lint (uses global soroban default) ────────
  # Renamed status-check to "Backend / OpenAPI Spec (Soroban default)" so the
  # adapter it runs against is unambiguous in branch protection.
  openapi-spec:
    name: Backend / OpenAPI Spec (Soroban default)
    runs-on: ubuntu-latest
    needs: backend-build-unit-mock

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soter
          POSTGRES_PASSWORD: soter
          POSTGRES_DB: soter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        working-directory: app/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test

      - name: Debug — onchain adapter + RPC env (masked) BEFORE spec drift check
        run: |
          set +e
          echo "ONCHAIN_ADAPTER=${ONCHAIN_ADAPTER}"
          _m() { local v="$1"; if [ -z "$v" ]; then echo ""; elif [ ${#v} -le 8 ]; then echo "***"; else echo "${v:0:3}...${v: -3}"; fi; }
          echo "STELLAR_RPC_URL=$(_m "${STELLAR_RPC_URL}")"
          echo "SOROBAN_RPC_URL=$(_m "${SOROBAN_RPC_URL}")"
          echo "SOROBAN_NETWORK=${SOROBAN_NETWORK}"

      - name: Check OpenAPI spec drift
        working-directory: app/backend
        run: pnpm run spec:check
        env:
          DATABASE_URL: postgresql://soter:soter@localhost:5432/soter_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test

      - name: Lint OpenAPI spec
        working-directory: app/backend
        run: pnpm run spec:lint
